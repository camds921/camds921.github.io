<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lowkey Labs</title>
<meta name="description" content="Lowkey Labs — small, private apps.">
<style>
:root { --bg:#ffffff; --text:#0f172a; --muted:#64748b; --accent:#123771;
        --rule:#e6eaf1; --card:#f1f4fd; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0b1220; --text:#e2e8f0; --muted:#94a3b8; --accent:#9db7e8;
          --rule:#1e293b; --card:#111a2e; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text);
       font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
       Helvetica, Arial, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 8px; }
h2 { font-size: 1.2rem; margin: 2rem 0 .5rem; color: var(--accent); }
a { color: var(--accent); }
p, li { max-width: 68ch; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
code { background: var(--card); padding: 1px 5px; border-radius: 4px; }
.card { background: var(--card); border-radius: 14px; padding: 20px; }
.muted { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>

<h1>Lowkey Labs</h1>
<p class="muted">Small, private, useful apps — made in Australia.</p>
<div class="card">
  <h2 style="margin-top:0">Stamp Duty Australia</h2>
  <p>Stamp duty, first home buyer concessions and mortgage repayments for
  every Australian state and territory. Calculations stay on your device.</p>
  <p><a href="/stampduty/privacy/">Privacy policy</a></p>
</div>
<h2>Support</h2>
<p>Questions or feedback: <a href="mailto:camds921@gmail.com">camds921@gmail.com</a></p>

</main>
</body>
</html>
